name: Import ENM_curriculum

on:
  push:
    paths:
      - '.github/workflows/import-enm-curriculum.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: |
          rm -rf /tmp/ENM_curriculum
          git clone --depth 1 https://github.com/qiaohj/ENM_curriculum.git /tmp/ENM_curriculum
          rm -rf /tmp/ENM_curriculum/.git

      - name: Copy source repository into subfolder
        run: |
          rm -rf ENM_curriculum
          mkdir -p ENM_curriculum
          cp -a /tmp/ENM_curriculum/. ENM_curriculum/

      - name: Remove one-time workflow and commit import
        run: |
          rm -f .github/workflows/import-enm-curriculum.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import qiaohj/ENM_curriculum into ENM_curriculum"
          git push origin HEAD:main
