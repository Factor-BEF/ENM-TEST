name: Import Awesome-GEE once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-awesome-gee-once.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository and replace folder
        run: |
          rm -rf /tmp/Awesome-GEE
          git clone --depth 1 --branch gh-pages https://github.com/opengeos/Awesome-GEE.git /tmp/Awesome-GEE
          rm -rf Awesome-GEE
          mkdir -p Awesome-GEE
          rsync -a --exclude='.git' /tmp/Awesome-GEE/ Awesome-GEE/
          rm -f .github/workflows/import-awesome-gee-once.yml

      - name: Commit exact import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize opengeos/Awesome-GEE exact contents"
            git push origin main
          fi
